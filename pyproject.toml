[project]
name = "agent-evals"
version = "0.1.0"
description = "A small eval harness for tool-using agents: output, trajectory and budget checks over repeated trials."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
judge = ["anthropic>=2.8"]
examples = ["ops-agent @ git+https://github.com/AmeesAnsari/ops-agent@main"]
dev = ["pytest>=8", "anthropic>=2.8"]

[project.scripts]
agent-evals = "agent_evals.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["agent_evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
