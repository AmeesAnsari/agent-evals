name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,examples]"
      - run: pytest -q
      - name: Example suite passes offline
        run: python -m agent_evals examples/ops_agent_suite.py --trials 3 >> "$GITHUB_STEP_SUMMARY"
      - name: Example suite catches the regression (must fail)
        run: |
          if DEMO_REGRESSION=1 python -m agent_evals examples/ops_agent_suite.py --trials 2 >> "$GITHUB_STEP_SUMMARY"; then
            echo "The regression was not caught" && exit 1
          fi
